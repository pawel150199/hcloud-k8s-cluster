name: Pre commit check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  pre-commit-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Download flake and black
        run: |
          pip install flake8
          pip install black

      - name: Download pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit install

      - name: Download terraform
        uses: hashicorp/setup-terraform@v4

      - name: Verify the terraform installation
        run: |
          terraform -help

      - name: Install terraform-docs
        run: |
          TFDOCS_VERSION="v0.24.0"
          BASE_URL="https://github.com/terraform-docs/terraform-docs/releases/download"
          ASSET="terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "${BASE_URL}/${TFDOCS_VERSION}/${ASSET}"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files
